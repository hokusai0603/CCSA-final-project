{{- if .Values.postgres.enabled }}
{{- $name := include "drawguess.postgres.fullname" . }}
{{- $auth := .Values.postgres.auth }}
# Headless Service: stable network identity for the StatefulSet pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "drawguess.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "drawguess.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
# Client Service: what the apps connect to (host {{ $name }}, port 5432).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "drawguess.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "drawguess.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "drawguess.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ $name }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "drawguess.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "drawguess.labels" (dict "ctx" $ "component" "postgres") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      {{- with .Values.stateful.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          env:
            - {name: POSTGRES_DB, value: {{ $auth.database | quote }}}
            - {name: POSTGRES_USER, value: {{ $auth.username | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawguess.postgres.secretName" . }}
                  key: password
          ports:
            - {name: postgres, containerPort: 5432}
          securityContext:
            {{- include "drawguess.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          startupProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: postgres}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Fast shutdown (rolls back open transactions, checkpoints, exits)
              # instead of SIGTERM's "smart" mode, which waits for clients to leave.
              exec: {command: [sh, -c, 'pg_ctl -D "$PGDATA" -m fast -w -t 25 stop']}
          volumeMounts:
            # PostgreSQL 18 images keep data in /var/lib/postgresql/18/docker (PGDATA);
            # mounting the parent keeps future major-version upgrades on the same volume.
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 128Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "drawguess.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "drawguess.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
