{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
{{- /*
  The password is generated on first install and then reused: `lookup` returns the
  Secret already in the cluster, so `helm upgrade` keeps it. PostgreSQL stores the
  password at initdb time, so a new one would no longer match the data on the PVC.
  For the same reason the Secret survives `helm uninstall` (resource-policy: keep),
  like the PVC does. `helm template` (no cluster) renders a throwaway random value.
*/ -}}
{{- $name := include "drawguess.postgres.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "drawguess.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
