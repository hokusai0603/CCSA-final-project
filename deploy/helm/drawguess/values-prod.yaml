# "Production" environment (namespace drawguess-prod) on the same cluster:
# larger volumes and more headroom. Real production would use managed or HA
# Redis/PostgreSQL instead (ADR-004).
redis:
  maxmemory: 400mb
  persistence:
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 1000m, memory: 512Mi}

postgres:
  persistence:
    size: 4Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 2000m, memory: 1Gi}

ingress:
  host: prod.localhost
