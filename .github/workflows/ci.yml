# CI runs exactly what developers run locally: `make lint` and `make test`
# (scripts/lint.sh, scripts/test.sh). Service projects and the Helm chart are
# discovered, so new services are covered without editing this file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same versions as the documented local toolchain (README prerequisites).
  HELM_VERSION: v3.22.1
  SHELLCHECK_VERSION: v0.11.0

jobs:
  checks:
    name: lint + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # setup-uv publishes no floating major tag (v10 does not resolve); pin the release commit.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          cache-dependency-glob: "services/**/uv.lock"
          # Until a Python service exists there is nothing to cache; don't fail on that.
          ignore-nothing-to-cache: true

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          node --version
          uv --version
          helm version --short
          shellcheck --version | sed -n 2p

      - name: make lint
        run: make lint

      - name: make test
        run: make test
